name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact: "*.dmg"
          - os: windows-latest
            platform: win
            artifact: "*.exe"
          - os: ubuntu-latest
            platform: linux
            artifact: "*.AppImage"

    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build renderer
        run: npm run build

      # macOS: signed + notarized build (requires Apple Developer secrets in repo settings)
      # To enable: add APPLE_ID, APPLE_ID_PASSWORD, APPLE_TEAM_ID, CSC_LINK, CSC_KEY_PASSWORD
      # as repository secrets. See docs/code-signing.md for instructions.
      - name: Package macOS (signed + notarized)
        if: matrix.platform == 'mac' && env.APPLE_ID != ''
        run: npx electron-builder --mac --publish never
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # electron-builder reads these for notarization
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: Package macOS (unsigned — no signing secrets set)
        if: matrix.platform == 'mac' && env.APPLE_ID == ''
        run: npx electron-builder --mac --publish never
        env:
          APPLE_ID: ""
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Windows: Authenticode signing (optional — set WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD)
      - name: Package Windows (signed)
        if: matrix.platform == 'win' && env.WIN_CSC_LINK != ''
        run: npx electron-builder --win --publish never
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Package Windows (unsigned)
        if: matrix.platform == 'win' && env.WIN_CSC_LINK == ''
        run: npx electron-builder --win --publish never
        env:
          WIN_CSC_LINK: ""

      - name: Package Linux
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all/

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --oneline $PREV_TAG..HEAD --no-merges | head -30)
          else
            CHANGES=$(git log --oneline -20 --no-merges)
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Edge Deployer ${{ github.ref_name }}
          body: |
            ## What's new in ${{ github.ref_name }}

            ${{ steps.changelog.outputs.changes }}

            ---

            ### Downloads

            | Platform | File |
            |---|---|
            | macOS | `.dmg` |
            | Windows | `.exe` (NSIS installer) |
            | Linux | `.AppImage` |

            **First time?** See the [Getting Started](../README.md#getting-started) guide.
          files: dist-all/**/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
